name: discord-activity
version: 0.1.0
description: "Live tool and model status for Discord: one message per conversation, edited in place with each tool's status, duration, arguments and result."
author: "markku636"
requires_env:
  - DISCORD_BOT_TOKEN
provides_hooks:
  - pre_llm_call
  - post_llm_call
  - agent_loop_stopped
  - pre_api_request
  - post_api_request
  - api_request_error
  - pre_tool_call
  - post_tool_call
